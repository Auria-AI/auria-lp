name: Deploy to Vercel

# Production deploys come from the Vercel Git integration on every push to
# main. This workflow only runs when triggered manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@54.7.1

      - name: Deploy to production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_UPSHYeKMagUWH1lhFlv0Nio0
          VERCEL_PROJECT_ID: prj_50ypgrfz0zLVn6CN5shOtVdE3Lpw
